# 曲を BeatSaver から取ってきて、ワールドで流せる形に変え、Cloudflare Pages に置く。
# 6 時間ごとに自動で動く。GitHub の「Actions」の画面から、手で動かすこともできる(Run workflow)
name: publish-songs
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
concurrency:
  group: publish-songs
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg を入れる
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 曲のファイルを作る
        run: node build-site.mjs --out site
      - name: Cloudflare Pages に置く
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy site --project-name="$(node -p "require('./publish.config.json').projectName")" --branch=main --commit-dirty=true
